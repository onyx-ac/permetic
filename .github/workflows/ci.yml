name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./gradlew ktlintCheck detekt
      - run: ./gradlew :permetic:test

  permetic-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/permetic-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # connectedAndroidTest (instrumented tests) needs a device/emulator and isn't wired
  # up yet — spec 01's instrumented fixture-page suite runs manually until a runner
  # is added here.
