build:
  maxIssues: 0

config:
  validation: true

style:
  MagicNumber:
    active: false
  # ac.onyx.permetic.transport (excluding the transport/android/ subpackage, added in
  # spec 01 task 3) is JVM-only and must stay testable without Robolectric or
  # instrumentation — see spec 01, task 2.
  ForbiddenImport:
    active: true
    # Files directly under transport/ and ota/ are JVM-only by design, so their whole
    # state machines stay unit-testable without an emulator. The `android` subpackages
    # (transport/android/, ota/android/) are the deliberate exception and are not
    # matched by the single `*` here.
    includes:
      - '**/ac/onyx/permetic/transport/*.kt'
      - '**/ac/onyx/permetic/ota/*.kt'
    imports:
      - 'android.*'
      - 'androidx.*'
