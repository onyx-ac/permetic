<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>permetic instrumented test fixture</title>
</head>
<body>
  <script>
    // Drives the real WebViewCompat.addWebMessageListener-injected object end to
    // end: no mocked `permetic` object, per spec 01's verification section. The
    // TestProbe interface is a test-only bridge (added via addJavascriptInterface
    // by the instrumented test itself) that forwards the raw reply back to the JVM
    // side so the test can assert on it.
    window.PermeticNative.onmessage = function (event) {
      window.TestProbe.onReply(event.data);
    };
    window.PermeticNative.postMessage(
      '{"v":1,"id":"itest-1","capability":"system","method":"info","args":[]}'
    );
  </script>
</body>
</html>
